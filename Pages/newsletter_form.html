<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Newsletter | Team Paradise 1165</title>
        <link rel="icon" href="/Resources/Favicons/favicon.png" />
        <link rel="stylesheet" href="/Pages/style.css" />
        <link
            rel="stylesheet"
            href="https://cdn-images.mailchimp.com/embedcode/classic-061523.css"
        />
        <script src="/Pages/site.js" defer></script>
    </head>
    <body>
        <a class="skip-link" href="#main-content">Skip to main content</a>
        <header id="navbar" aria-label="Site header" aria-busy="true"></header>
        <main id="main-content" tabindex="-1">
            <!--
                Mailchimp depends on several exact names and IDs below. Check
                the README before changing this form, then test a real sign-up.
            -->
            <div id="mc_embed_signup">
                <form
                    action="https://teamparadise1165.us21.list-manage.com/subscribe/post?u=bfb8bbb50a765dbf4be3ea599&amp;id=4d6fdc5d11&amp;f_id=00c781e6f0"
                    method="post"
                    id="mc-embedded-subscribe-form"
                    name="mc-embedded-subscribe-form"
                    class="validate"
                    target="_blank"
                >
                    <div id="mc_embed_signup_scroll">
                        <h1>Subscribe to Team Paradise updates</h1>
                        <p>
                            Receive monthly updates about Team 1165. Submitting
                            this form opens Mailchimp in a new tab.
                        </p>
                        <p>
                            <span aria-hidden="true">*</span> indicates a required
                            field.
                        </p>
                        <div class="mc-field-group">
                            <label for="mce-EMAIL">
                                Email address <span aria-hidden="true">*</span>
                            </label>
                            <input
                                type="email"
                                name="EMAIL"
                                class="required email"
                                id="mce-EMAIL"
                                autocomplete="email"
                                required
                            />
                        </div>
                        <div
                            id="mce-responses"
                            class="clear foot"
                            aria-live="polite"
                        >
                            <!-- Mailchimp writes validation and result messages here. -->
                            <div
                                class="response"
                                id="mce-error-response"
                                style="display: none"
                            ></div>
                            <div
                                class="response"
                                id="mce-success-response"
                                style="display: none"
                            ></div>
                        </div>
                        <div class="honeypot" aria-hidden="true">
                            <!--
                                Bots often fill every field. Real visitors never
                                see this one.
                            -->
                            <label for="mailing-list-check">Leave this field blank</label>
                            <input
                                id="mailing-list-check"
                                type="text"
                                name="b_bfb8bbb50a765dbf4be3ea599_4d6fdc5d11"
                                tabindex="-1"
                                autocomplete="off"
                            />
                        </div>
                        <div class="optionalParent">
                            <div class="clear foot">
                                <input
                                    type="submit"
                                    name="subscribe"
                                    id="mc-embedded-subscribe"
                                    class="button"
                                    value="Subscribe"
                                />
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <!-- Mailchimp supplies jQuery and its form validation in this file. -->
            <script
                src="https://s3.amazonaws.com/downloads.mailchimp.com/js/mc-validate.js"
            ></script>
            <script>
                // This field map is generated by Mailchimp for the team's audience.
                // Most fields are not visible today, but the validator expects the map.
                (function ($) {
                    window.fnames = new Array();
                    window.ftypes = new Array();
                    fnames[0] = "EMAIL";
                    ftypes[0] = "email";
                    fnames[1] = "FNAME";
                    ftypes[1] = "text";
                    fnames[2] = "LNAME";
                    ftypes[2] = "text";
                    fnames[3] = "ADDRESS";
                    ftypes[3] = "address";
                    fnames[4] = "PHONE";
                    ftypes[4] = "phone";
                    fnames[5] = "BIRTHDAY";
                    ftypes[5] = "birthday";
                })(jQuery);
                var $mcj = jQuery.noConflict(true);
            </script>
        </main>
        <footer id="socials" aria-label="Team links" aria-busy="true"></footer>
    </body>
</html>
