<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Sponsor Us | Team Paradise 1165</title>
        <link rel="icon" href="/Resources/Favicons/favicon.png" />
        <link rel="stylesheet" href="/Pages/style.css" />
        <script src="/Pages/site.js" defer></script>
    </head>
    <body>
        <a class="skip-link" href="#main-content">Skip to main content</a>
        <header id="navbar" aria-label="Site header" aria-busy="true"></header>
        <main id="main-content" tabindex="-1">
            <div class="Title-Container">
                <h1 class="page-title">Sponsor Us</h1>
                <img
                    src="/Resources/Icons/handshake-icon.png"
                    id="TeamIcon"
                    width="200"
                    height="200"
                    alt=""
                    decoding="async"
                />
            </div>
            <section id="sponsorship-packet" aria-labelledby="packet-title">
                <h2 id="packet-title">Sponsorship packet</h2>
                <!-- Google Drive provides an in-page preview of the team's PDF. -->
                <iframe
                    title="Team Paradise sponsorship packet"
                    src="https://drive.google.com/file/d/1y0oMwdw08r1qYPNYyMETamQ2ETp2UfEa/preview"
                    width="640"
                    height="480"
                    allow="autoplay"
                    loading="lazy"
                ></iframe>
            </section>
        </main>
        <footer id="socials" aria-label="Team links" aria-busy="true"></footer>
    </body>
</html>
